<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <g transform="translate(96, 96) scale(0.625)">
    <!-- Bus Outline -->
    <rect x="64" y="64" width="384" height="360" rx="60" fill="url(#bus)" />
    <!-- Windshield -->
    <rect x="96" y="96" width="320" height="130" rx="20" fill="#ffffff" opacity="0.95" />
    <!-- Text on windshield -->
    <text x="256" y="180" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#4f46e5" text-anchor="middle">VOCAB</text>
    <!-- Headlights -->
    <circle cx="128" cy="340" r="28" fill="#fbbf24" />
    <circle cx="384" cy="340" r="28" fill="#fbbf24" />
    <!-- Grill Lines -->
    <line x1="200" y1="330" x2="312" y2="330" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="210" y1="360" x2="302" y2="360" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
